<!doctype html>

<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Luka - فروشگاه هوشمند محصولات دیجیتال" />

    <title>Luka | فروشگاه محصولات دیجیتال</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="products-page">
      <header class="hero">
        <!-- Top Header -->
        <div class="header-top">
          <!-- Logo -->
          <a href="index.html" class="luka-logo">
            <span class="logo-mark">L</span>

            <span class="logo-name">
              Luka
              <small>Digital Store</small>
            </span>
          </a>
        </div>

        <!-- Navigation -->
        <nav class="main-nav" aria-label="منوی اصلی">
          <ul>
            <li>
              <a href="index.html"> خانه </a>
            </li>

            <li>
              <a href="products.html" class="active" aria-current="page">
                محصولات
              </a>
            </li>

            <li>
              <a href="about.html"> درباره ما </a>
            </li>

            <li>
              <a href="contact.html"> تماس با ما </a>
            </li>
          </ul>
        </nav>

        <!-- Hero Content -->
        <div class="hero-content">
          <span class="hero-badge"> ✦ فروشگاه دیجیتال </span>

          <h1>
            محصولات دیجیتال
            <span>برای انتخاب بهتر</span>
          </h1>

          <p>جدیدترین محصولات دیجیتال را با بهترین قیمت پیدا کنید.</p>
        </div>
      </header>

      <section class="products-layout">
        <aside class="filter-sidebar">
          <!-- CATEGORY -->
          <div class="filter-section">
            <div class="filter-title">
              <h2>دسته‌بندی</h2>

              <button type="button" class="reset-btn">حذف فیلتر</button>
            </div>

            <div class="filter-options">
              <label class="check-option">
                <input
                  type="checkbox"
                  class="category-filter"
                  data-category="all"
                  checked
                />

                <span> همه محصولات </span>
              </label>

              <label class="check-option">
                <input
                  type="checkbox"
                  class="category-filter"
                  data-category="laptop"
                />

                <span> لپ‌تاپ </span>
              </label>

              <label class="check-option">
                <input
                  type="checkbox"
                  class="category-filter"
                  data-category="mobile"
                />

                <span> موبایل </span>
              </label>

              <label class="check-option">
                <input
                  type="checkbox"
                  class="category-filter"
                  data-category="headphone"
                />

                <span> هدفون </span>
              </label>

              <label class="check-option">
                <input
                  type="checkbox"
                  class="category-filter"
                  data-category="airpods"
                />

                <span> ایرپاد </span>
              </label>

              <label class="check-option">
                <input
                  type="checkbox"
                  class="category-filter"
                  data-category="smartwatch"
                />

                <span> ساعت هوشمند </span>
              </label>
            </div>
          </div>

          <!-- AVAILABILITY -->
          <div class="filter-section">
            <div class="filter-title">
              <h2>موجودی</h2>

              <button type="button" class="reset-btn">حذف</button>
            </div>

            <div class="filter-options">
              <label class="check-option">
                <input type="checkbox" name="availability" value="in-stock" />

                <span> موجود </span>
              </label>

              <label class="check-option">
                <input
                  type="checkbox"
                  name="availability"
                  value="out-of-stock"
                />

                <span> ناموجود </span>
              </label>
            </div>
          </div>

          <!-- PRICE -->
          <div class="filter-section">
            <div class="filter-title">
              <h2>محدوده قیمت</h2>

              <button type="button" class="reset-btn">حذف</button>
            </div>

            <div class="price-range">
              <input
                type="range"
                id="priceRange"
                min="0"
                max="100000000"
                value="75000000"
                step="1000000"
              />

              <div class="price-values">
                <span> ۰ تومان </span>

                <strong id="priceValue"> ۷۵,۰۰۰,۰۰۰ تومان </strong>
              </div>
            </div>
          </div>
        </aside>

        <section class="products-content">
          <!-- TOOLBAR -->
          <div class="products-toolbar">
            <div class="products-count">
              <strong id="productsCount"> ۸ </strong>

              محصول نمایش داده می‌شود
            </div>

            <div class="sort-box">
              <label for="sortProducts"> مرتب‌سازی: </label>

              <select id="sortProducts">
                <option value="default">پیش‌فرض</option>

                <option value="cheap">ارزان‌ترین</option>

                <option value="expensive">گران‌ترین</option>

                <option value="name">نام محصول</option>
              </select>
            </div>
          </div>

          <div class="products-grid" id="productsGrid"></div>
        </section>
      </section>
    </main>

    <!-- JavaScript -->
    <script src="js/script.js"></script>
    ```
  </body>
</html>
